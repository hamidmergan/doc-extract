[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-extract"
version = "0.1.0"
description = "Extract text as Markdown from scans, images and PDFs with a vision model"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Hamid Mergan" }]
dependencies = [
    "openai>=1.30",
    "pypdfium2>=4.30",
    "Pillow>=10.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
doc-extract = "doc_extract.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
